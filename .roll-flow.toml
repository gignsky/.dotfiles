config_version = 1
repo_root = "/home/gig/.dotfiles"
rolling_branch = "develop"
stable_branch = "main"
roll_prefix = "roll/"
username = "gig"
hosts = []
mode = "assist"

# Gates that must pass before a roll graduates to the rolling branch (develop).
# Verify the flake evaluates/builds, then dry-build each ACTIVE host (system +
# home). roll-flow gates are literal commands (no host templating), so there is
# one `just test-rebuild-full <host>` line per active host below — add a line
# when a host is activated in [host_active] (e.g. spacedock on roll/20).
roll_to_rolling_gates = [
    "echo '----------- NIX FLAKE CHECK -----------'",
    "nix flake check --print-build-logs",
]
rolling_to_main_gates = [
    "echo '----------- NIX FLAKE CHECK -----------'",
    "nix flake check --print-build-logs",
    "echo '----------- NIXOS REBUILD CHECK -------'",
    "just test-rebuild wsl",
    "just test-rebuild spacedock",
    "just test-rebuild merlin",
    "just test-rebuild ganoslal",
    "echo '----------- HM REBUILD CHECK ----------'",
    "just test-home wsl",
    "just test-home spacedock",
    "just test-home merlin",
    "just test-home ganoslal"
]

# Per-host active status for roll-flow verification.
[host_active]
ganoslal = true
merlin = true
wsl = true
spacedock = true

# The TUI's `n` rebuild menu. Each entry runs your justfile recipes, so every
# pre/post step they do (sudo-keepalive, dont-fuck-my-build, cache-push) is
# kept, and the rebuild scripts write the marker commits the `build` column
# reads. `sudo` is off because `just rebuild` already asks via sudo-keepalive.
[[rebuild_menu]]
key = "s"
label = "switch: NixOS, then home-manager"
commands = ["just switch"]

[[rebuild_menu]]
key = "r"
label = "rebuild: NixOS switch"
commands = ["just rebuild"]

[[rebuild_menu]]
key = "t"
label = "NixOS test (not added to the bootloader)"
commands = ["just rebuild -T"]

[[rebuild_menu]]
key = "b"
label = "NixOS boot (active from the next boot)"
commands = ["just rebuild -b"]

[[rebuild_menu]]
key = "h"
label = "home-manager switch"
commands = ["just home"]

[[rebuild_menu]]
key = "H"
label = "home-manager test build (no generation created)"
commands = ["just home -t"]
